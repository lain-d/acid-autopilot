# Builds the Android app (an APK you can install directly) from the same files as the website,
# and publishes it as the "android-latest" release of this repository.
name: Android app
on:
  push:
    branches: [main]
    paths: ["android-app/**", "index.html", "ladder.js", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Gather the web app
        working-directory: android-app
        run: |
          mkdir -p www
          cp ../index.html ../ladder.js ../favicon-32.png ../icon-192.png ../apple-touch-icon.png native.js www/
          sed -i 's#</body>#<script src="native.js"></script></body>#' www/index.html
          python3 patch-web.py www/index.html
      - name: Install Capacitor
        working-directory: android-app
        run: npm install
      - name: Create the Android project
        working-directory: android-app
        run: npx cap add android
      - name: App icon
        working-directory: android-app
        run: npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor "#252a34" --iconBackgroundColorDark "#252a34" --splashBackgroundColor "#070a12" --splashBackgroundColorDark "#070a12"
      - name: Background playback service
        run: python3 android-app/native/patch.py
      - name: Sync
        working-directory: android-app
        run: npx cap sync android
      - name: Build the APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Collect
        run: cp android-app/android/app/build/outputs/apk/debug/app-debug.apk AcidAutopilot.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AcidAutopilot-apk
          path: AcidAutopilot.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest AcidAutopilot.apk --title "Acid Autopilot for Android" --notes "Install AcidAutopilot.apk on an Android phone (allow installs from your browser or file manager when asked). Built from commit ${GITHUB_SHA::7}."
